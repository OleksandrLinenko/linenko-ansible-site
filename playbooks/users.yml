---
- name: Manage existing user and SSH keys
  hosts: all
  become: true

  tasks:
    - name: Ensure user exists
      ansible.builtin.user:
        name: "{{ user_name }}"
        state: present
        create_home: true
        password: "*"
        update_password: on_create

    - name: Configure authorized SSH keys
      ansible.posix.authorized_key:
        user: "{{ user_name }}"
        key: "{{ user_ssh_keys | join('\n') }}"
        state: present
        exclusive: true
